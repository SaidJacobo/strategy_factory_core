<!-- Modal de Bootstrap -->
<div class="modal fade" id="botsModal" tabindex="-1" aria-labelledby="botsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xs">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="botsModalLabel">Bots Weights</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" style="max-height: 800px; overflow-y: auto;">
                <input type="hidden" id="id" name="id" value="{{ vm.PortfolioId }}">

                <div class="table-responsive">
                    <table id="weightsTable" class="table table-custom">
                        <thead>
                            <tr>
                                <th>Bot</th>
                                <th>Weight</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for pf_bt in vm.PortfolioBacktests %}
                                <tr>
                                    <td>
                                        {{ pf_bt.BotName }}
                                    </td>
                                    <td>
                                        <input type="number" id="{{ pf_bt.BacktestId }}" name="bot-id" class="form-control" min="0" step="0.01" value="{{ pf_bt.BotWeight }}" required>
                                    </td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveWeightsButton" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>
</div>
