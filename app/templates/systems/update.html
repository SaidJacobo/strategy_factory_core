{% extends "base.html" %}

{% block title %}Update System{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="text-center mb-4">Update System</h1>
    <form action="/systems/{{ system.Id }}" method="post" class="w-50 mx-auto p-4 rounded shadow-sm">
        
        <input type="hidden" id="id" name="id" value="{{ system.Id }}">

        <!-- Campo de nombre -->
        <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input type="text" id="name" name="name" class="form-control" required placeholder="System name" value="{{ system.Name }}">
        </div>
        <!-- Campo de descripción -->
        <div class="mb-3">
            <label for="description" class="form-label">Description:</label>
            <textarea id="description" name="description" class="form-control" rows="4" required placeholder="System description">{{ system.Description }}</textarea>
        </div>
        <!-- Botón de enviar -->
        <div class="text-center">
            <button type="submit" class="btn btn-primary">Update</button>
        </div>
    </form>
</div>
{% endblock %}
